# OpenWebUI Helm Values for AKS - CONNECTED TO K3D VIA TAILSCALE
ollama:
  enabled: false

# Ollama via Tailscale (WSL2/K3d)
ollamaUrls:
  - "http://100.113.55.54:11434"

extraEnvVars:
  - name: WEBUI_AUTH
    value: "false"
  - name: ENABLE_SIGNUP
    value: "true"
  - name: ENABLE_WEBSOCKET_SUPPORT
    value: "false"

persistence:
  enabled: false

websocket:
  enabled: false
  redis:
    enabled: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

pipelines:
  enabled: false
