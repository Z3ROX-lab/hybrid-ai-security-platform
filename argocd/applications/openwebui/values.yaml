# OpenWebUI with ngrok tunnel to Ollama (NO REDIS)
ollama:
  enabled: false

ollamaUrls:
  - "https://untorpedoed-domitila-diphase.ngrok-free.dev"

extraEnvVars:
  - name: WEBUI_AUTH
    value: "false"
  - name: ENABLE_SIGNUP
    value: "true"
  - name: ENABLE_WEBSOCKET_SUPPORT
    value: "false"

persistence:
  enabled: false

websocket:
  enabled: false

redis:
  enabled: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

pipelines:
  enabled: false
