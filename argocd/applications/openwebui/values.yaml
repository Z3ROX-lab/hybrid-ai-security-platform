# OpenWebUI Helm Values for AKS - MINIMAL
ollama:
  enabled: false

ollamaUrls:
  - "http://ollama-k3d:11434"

extraEnvVars:
  - name: WEBUI_AUTH
    value: "false"
  - name: ENABLE_SIGNUP
    value: "true"
  - name: WEBSOCKET_MANAGER
    value: ""
  - name: REDIS_URL
    value: ""

persistence:
  enabled: false

websocket:
  enabled: false
  redis:
    enabled: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

pipelines:
  enabled: false
