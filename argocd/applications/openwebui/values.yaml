# OpenWebUI with ngrok tunnel to Ollama
ollama:
  enabled: false

ollamaUrls:
  - "https://untorpedoed-domitila-diphase.ngrok-free.dev"

extraEnvVars:
  - name: WEBUI_AUTH
    value: "false"
  - name: ENABLE_SIGNUP
    value: "true"

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

pipelines:
  enabled: false
