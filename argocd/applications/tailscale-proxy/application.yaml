apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-proxy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Z3ROX-lab/hybrid-ai-security-platform.git
    targetRevision: HEAD
    path: argocd/applications/tailscale-proxy/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
