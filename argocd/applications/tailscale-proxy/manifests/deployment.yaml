apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-proxy
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-proxy
  template:
    metadata:
      labels:
        app: tailscale-proxy
    spec:
      serviceAccountName: tailscale-proxy
      containers:
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        - name: TS_STATE_DIR
          value: "/var/lib/tailscale"
        - name: TS_HOSTNAME
          value: "aks-proxy"
        - name: TS_KUBE_SECRET
          value: "tailscale-state"
        - name: TS_USERSPACE
          value: "false"
        securityContext:
          privileged: true
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: dev-tun
          mountPath: /dev/net/tun
      - name: socat
        image: alpine/socat:latest
        args:
        - "TCP-LISTEN:11434,fork,reuseaddr"
        - "TCP:100.113.55.54:11434"
        ports:
        - containerPort: 11434
          name: ollama
      volumes:
      - name: tailscale-state
        emptyDir: {}
      - name: dev-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
