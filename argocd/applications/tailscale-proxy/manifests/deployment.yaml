apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-proxy
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-proxy
  template:
    metadata:
      labels:
        app: tailscale-proxy
    spec:
      serviceAccountName: tailscale-proxy
      containers:
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        - name: TS_USERSPACE
          value: "true"
        - name: TS_STATE_DIR
          value: "/var/lib/tailscale"
        - name: TS_HOSTNAME
          value: "aks-proxy"
        - name: TS_KUBE_SECRET
          value: "tailscale-state"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
      volumes:
      - name: tailscale-state
        emptyDir: {}
