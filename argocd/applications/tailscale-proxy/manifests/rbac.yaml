apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-proxy
  namespace: ai-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-proxy
  namespace: ai-platform
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-proxy
  namespace: ai-platform
subjects:
- kind: ServiceAccount
  name: tailscale-proxy
  namespace: ai-platform
roleRef:
  kind: Role
  name: tailscale-proxy
  apiGroup: rbac.authorization.k8s.io
